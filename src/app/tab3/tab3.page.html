<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <ion-icon name="file-tray-full-outline"></ion-icon> Add Course Form
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>

    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-input label="Course" placeholder="Enter course name"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Time" placeholder="Enter course time"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Lecturer" placeholder="Enter lecturer name"></ion-input>
        </ion-item>
      </ion-list>
      <ion-button>Save</ion-button>
    </ion-card-content>

  </ion-card>
</ion-content>
